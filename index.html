<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>대출확정리스트 | 로드온 모빌리티</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0c;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f6f7f9}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#a1a1aa;font:600 14px/1.7 -apple-system,'Malgun Gothic',sans-serif;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="msg">불러오는 중...</div>
<script>
/* ============================================================
   대출확정리스트 · 화면 로더 (GitHub index.html — 이 파일은 다시 교체할 필요 없음)
   · Supabase 에 관리자가 올린 최신 화면 파일(app.html)을 불러와 실행
   · 주소?safe   = 직전 버전으로 실행 (새 화면에 문제가 있을 때)
   · 주소?github = GitHub 에 올린 app.html 로 실행
   · 등록된 화면이 없거나 서버 연결 실패 시 GitHub app.html 로 실행
   ============================================================ */
(function(){
  var SUPABASE_URL = 'https://mzctmfytscqwelgdveik.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_57x5bcaBvhYK1R9W1K016g_jjIt8ZIr';
  var qs = location.search, SAFE = /[?&]safe(=|&|$)/.test(qs), GITHUB = /[?&]github(=|&|$)/.test(qs);
  var L = window.HDLoader = { id:null, mode:'', err:false, forced:GITHUB, reload:function(){ location.reload(); } };
  function msg(t){ var m = document.getElementById('msg'); if(m) m.innerHTML = t; }
  function get(query){
    return fetch(SUPABASE_URL + '/rest/v1/app_versions?' + query, { headers:{ apikey:SUPABASE_ANON_KEY }, cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function frame(){
    var f = document.createElement('iframe'); f.id = 'app'; f.title = '대출확정리스트';
    f.onload = function(){ var m = document.getElementById('msg'); if(m) m.remove(); try{ if(f.contentDocument && f.contentDocument.title) document.title = f.contentDocument.title; }catch(e){} try{ f.focus(); }catch(e){} };
    return f;
  }
  function mountHtml(v){ L.id = v.id; var f = frame(); f.srcdoc = v.html; document.body.appendChild(f); }
  function mountGithub(err){ L.mode = 'github'; L.err = !!err; var f = frame(); f.src = 'app.html?t=' + Date.now(); document.body.appendChild(f); }
  var job;
  if(GITHUB) job = Promise.resolve(null);
  else if(SAFE) job = get('select=id&is_current=eq.true&limit=1').then(function(cur){
      return get((cur[0] ? 'id=lt.' + cur[0].id + '&' : '') + 'select=id,html&order=id.desc&limit=1');
    }).then(function(r){ return r[0] || null; });
  else job = get('select=id,html&is_current=eq.true&limit=1').then(function(r){ return r[0] || null; });
  job.then(function(v){
    if(v){ L.mode = SAFE ? 'safe' : 'db'; mountHtml(v); }
    else mountGithub(false);
  }).catch(function(e){
    msg('서버 연결 확인 중...');
    mountGithub(true);
  });
})();
</script>
</body>
</html>
